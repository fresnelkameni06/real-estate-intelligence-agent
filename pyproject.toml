[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-intelligence-agent"
version = "0.1.0"
description = "Real Estate Investment Intelligence Agent — Paris: analytics and natural-language exploration of the Paris residential real-estate market."
readme = "README.md"
requires-python = ">=3.11"

# No runtime dependencies yet. They are introduced progressively, by phase.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Phase 1.2+ — data discovery & engineering (exploratory + pipeline).
# pandas >=2.3.3 is the first release compatible with Python 3.14; httpx >=0.28
# supports Python 3.14; pyarrow >=22 is the first with Python 3.14 wheels
# (Parquet support). All resolve to current stable wheels under 3.14.
discovery = [
    "pandas>=2.3.3",
    "httpx>=0.28",
    "pyarrow>=22",
]
# Phase 3.2 — PostgreSQL migrations and loading.
# All support Python 3.14: SQLAlchemy 2.0.x, Alembic 1.19+, psycopg 3 (binary).
database = [
    "sqlalchemy>=2.0.44",
    "psycopg[binary]>=3.2",
    "alembic>=1.19",
    "pydantic-settings>=2.7",
]
# Phase 5 — local FastAPI backend and Streamlit dashboard.
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "streamlit>=1.45",
    "httpx>=0.28",
    "plotly>=6.0",
]
# Phase 6 — RAG document acquisition and processing (no LLM, no embeddings).
rag = [
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "pydantic>=2.7",
    "pypdf>=5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The HTTP/UI entry points intentionally live in the repository-level app/
# package. Add the project root explicitly for consistent Windows/Linux imports.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A reasonable, non-aggressive starter rule set:
#   E, W  -> pycodestyle errors/warnings
#   F     -> pyflakes (undefined names, unused imports, etc.)
#   I     -> isort (import ordering)
#   UP    -> pyupgrade (modern syntax)
#   B     -> flake8-bugbear (likely bugs)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "real_estate_agent"]
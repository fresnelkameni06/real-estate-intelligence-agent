services:
  - type: web
    name: paris-real-estate-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m uvicorn --app-dir . app.api.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: python -m alembic upgrade head
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paris-real-estate-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SERVICE_NAME
        value: real-estate-intelligence-api
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  - type: web
    name: paris-real-estate-dashboard
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m streamlit run app/streamlit/app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: API_HOSTPORT
        fromService:
          type: web
          name: paris-real-estate-api
          property: hostport
      - key: API_TIMEOUT_SECONDS
        value: "15"
      - key: AI_API_TIMEOUT_SECONDS
        value: "180"

databases:
  - name: paris-real-estate-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: real_estate_db
    user: real_estate_app

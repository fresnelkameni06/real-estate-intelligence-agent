name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://real_estate_app:ci_only@127.0.0.1:5432/real_estate_ci_dev
      TEST_DATABASE_URL: postgresql+psycopg://real_estate_app:ci_only@127.0.0.1:5432/real_estate_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: real_estate_test
          POSTGRES_USER: real_estate_app
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_estate_app -d real_estate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database,app,rag,discovery]"

      - name: Lint
        run: python -m ruff check .

      - name: Test with PostgreSQL and pgvector
        run: python -m pytest -q

  container:
    name: Container build
    needs: quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag paris-real-estate-intelligence:${{ github.sha }} .
